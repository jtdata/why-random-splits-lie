[project]
name = "churnval"
version = "0.1.0"
description = "Temporal validation for churn models — why random splits lie"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "lifelines>=0.29",
    "matplotlib>=3.9",
    "mlflow>=2.16",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.scripts]
churnval = "churnval.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "nbstripout>=0.7",
    "papermill>=2.6",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnval"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD", "NPY", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.jupytext]
formats = "ipynb,py:percent"
